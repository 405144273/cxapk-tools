name: cxapk每日签到

on:
  schedule:
    # 北京时间每天早上6点 = UTC前一天22点
    - cron: '0 22 * * *'
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  checkin:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: cxapk-checkin
      cancel-in-progress: true
    env:
      TZ: Asia/Shanghai
      CXAPK_COOKIE: ${{ secrets.CXAPK_COOKIE }}
      SMTP_SERVER: ${{ secrets.SMTP_SERVER }}
      SMTP_PORT: ${{ secrets.SMTP_PORT }}
      SENDER_EMAIL: ${{ secrets.SENDER_EMAIL }}
      SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
      RECEIVER_EMAIL: ${{ secrets.RECEIVER_EMAIL }}
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 检查所需文件 & secrets
        run: |
          set -e
          if [ ! -f requirements.txt ]; then
            echo "requirements.txt not found at repo root" >&2
            exit 1
          fi
          if [ ! -f cxapk_checkin.py ]; then
            echo "cxapk_checkin.py not found at repo root" >&2
            exit 1
          fi
          if [ -z "${CXAPK_COOKIE}" ]; then
            echo "CXAPK_COOKIE secret is not set" >&2
            exit 1
          fi
          if [ -z "${SMTP_SERVER}" ] || [ -z "${SENDER_EMAIL}" ] || [ -z "${SMTP_PASSWORD}" ] || [ -z "${RECEIVER_EMAIL}" ]; then
            echo "One or more SMTP-related secrets are not set" >&2
            exit 1
          fi

      - name: 升级 pip 并安装依赖
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: 执行签到
        run: python -u cxapk_checkin.py
